# What this package declares about itself.
#
# The declaration is capability, not intent. `aru doctor` reads the application
# and never opens an installed package, so tests/Unit/audit_test.go is what
# compares these lines with what the code calls.

name = "hyz-is/mta"
# This package imports no framework package and requires no Hesape; it needs
# only the standard library and golang.org/x/net. The floor is the oldest
# Framework an application can run it beside.
framework = ">= 0.56"
profiles = ["conventional", "performance"]

[permissions]
# It dials the mail exchangers of the recipients' domains, asks DNS for their
# addresses, and the application chooses what listens: nothing else leaves the
# process.
network = true
# It writes the durable spool, only when the application hands it a DiskSpool
# and a directory; the in-memory spool touches no file.
filesystem = true
# It runs no other program.
exec = false
# It owns no table: its queue is the spool directory.
migrations = false
